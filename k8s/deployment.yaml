apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-myapp
  namespace: dev
  labels:
    app: flask-myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-myapp
  template:
    metadata:
      labels:
        app: flask-myapp
    spec:
      containers:
      - name: flask-myapp
        image: idogardana/myapp:34
        ports:
        - containerPort: 5000
        imagePullPolicy: Always